# CHAMPION'S RETIREMENT V1 BLUEPRINT
mixed_precision = "bf16"
save_precision = "bf16"
gradient_checkpointing = true
cache_latents = true
cache_latents_to_disk = true
xformers = true
output_dir = "test_sdxl_sd3"
output_name = "last"
save_model_as = "safetensors"
no_metadata = true
async_upload = true

# BUCKET & DATA
enable_bucket = true
min_bucket_reso = 256
max_bucket_reso = 2048
bucket_reso_steps = 64
bucket_no_upscale = true
resolution = "1024,1024"
train_data_dir = "img"
caption_extension = ".txt"
max_token_length = 75
max_data_loader_n_workers = 2

# NETWORK BASE
network_module = "networks.lora"
loss_type = "l2"
prior_loss_weight = 1.0
min_snr_gamma = 5
scale_weight_norms = 5

# EPOCHS & BATCH (Champion's Math)
max_train_epochs = 30
train_batch_size = 4
gradient_accumulation_steps = 1

# OPTIMIZER (Champion's Absolute Stability)
optimizer_type = "prodigy"
optimizer_args = ["decouple=True", "d_coef=1", "weight_decay=0.01", "use_bias_correction=True", "safeguard_warmup=True"]
unet_lr = 1
text_encoder_lr = 1
lr_scheduler = "constant"

# MISC
max_timestep = 1000
seed = 2951032222
low_vram = false
no_half_vae = true
dynamo_backend = "no"